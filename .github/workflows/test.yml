name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate example files
        run: |
          python -c "
          from aix_parser import AIXEnvelope
          import sys

          files = ['examples/minimal.aix', 'examples/full.aix', 'examples/pii_protected.aix', 'examples/soma_contract.aix']
          failed = False
          for f in files:
              is_valid, errors = AIXEnvelope.from_file(f).validate()
              status = 'OK' if is_valid else 'FAIL'
              print(f'{f}: {status} {errors}')
              if not is_valid:
                  failed = True
          sys.exit(1 if failed else 0)
          "
